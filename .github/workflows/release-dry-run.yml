name: Release dry run

on:
  workflow_dispatch:
  pull_request:
    paths:
      - releasebox.config.json
      - package.json
      - package-lock.json
      - .github/workflows/release*.yml

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASEBOX_REF: 9ef650354880ee84a1038d89e4522589c0f3d8b4

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install ReleaseBox
        run: |
          set -euo pipefail
          git clone https://github.com/rogerchappel/releasebox.git /tmp/releasebox
          git -C /tmp/releasebox checkout --detach "$RELEASEBOX_REF"
          npm --prefix /tmp/releasebox ci
          npm --prefix /tmp/releasebox run build
      - name: ReleaseBox readiness check
        run: node /tmp/releasebox/bin/releasebox.js check .
      - name: Validate distribution contract
        run: npm run release:readiness
      - name: Run release checks
        run: npm run release:check
      - name: Release notes preview
        run: |
          node /tmp/releasebox/bin/releasebox.js notes . > release-notes-preview.md
          cat release-notes-preview.md
      - name: Publish release notes summary
        run: cat release-notes-preview.md >> "$GITHUB_STEP_SUMMARY"
